name: Deploy GitHub Pages

# GitHub Pages now only serves lightweight redirects to https://mvps.pages.dev
# so existing outreach links keep working. The site source stays on main and
# is published to Cloudflare Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true
      - name: Build redirect pages
        run: python3 .github/scripts/build-github-redirects.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirects-out
      - id: deployment
        uses: actions/deploy-pages@v4
