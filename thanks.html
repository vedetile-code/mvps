<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you — order received</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
body{margin:0;font:17px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f3ec;color:#1b1b1b}
main{max-width:620px;margin:8vh auto;padding:32px;background:#fff;border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.06)}
h1{font-size:28px;margin:0 0 8px}a{color:#1c453c}.fine{color:#666;font-size:14px}
</style>
</head>
<body>
<main>
  <h1 id="t">Thank you — your order is in.</h1>
  <p id="next">You'll get a receipt by email now, and a personal reply with next steps within 24 hours.</p>
  <p>Questions or a refund (7 days, no questions asked): <a id="c" href="mailto:timwvedco@gmail.com">timwvedco@gmail.com</a></p>
  <p><a id="back" href="./">Back to the site</a></p>
  <p class="fine">Payment was handled by the checkout provider; no card details touch this site.</p>
</main>
<script src="checkout-config.js"></script>
<script>
(function(){
  var slug = new URLSearchParams(location.search).get("p");
  var p = slug && window.MVPS_CHECKOUT && window.MVPS_CHECKOUT.products[slug];
  var next = {
    nookshift: "Reply to the receipt (or email us) with up to 3 photos of the room or garden and the style you want. Your first AI restyles come back within 48 hours, and your founding year is locked in.",
    listready: "Reply with photos and notes for your first items (up to 20 this month). Drafts for each marketplace you sell on come back within 24 hours. Your founding rate is locked for 12 months.",
    "tellme-coach": "Your 30-day pass starts now. Every drill is open at tellme-coach/practice.html. Reply with your test date and the questions you find hardest: within 24 hours you get a personal written debrief with the official references, and you can send recordings for feedback any time in the 30 days.",
    quirepress: "Your founder year is locked at $99. Reply with what you're making (journal, planner, log book) and your trim size; we'll send your onboarding and a first interior within 48 hours.",
    shiftready: "Reply to the receipt with (1) your current resume, (2) the full job posting, and (3) licenses and certifications with expiry dates, plus anything we must not claim. Your files arrive within 48 hours of receiving those."
  };
  if (p) {
    document.getElementById("t").textContent = "Thank you — your " + p.name + " order is in.";
    document.getElementById("next").textContent = next[slug];
    var c = document.getElementById("c"); c.href = "mailto:" + p.contact + "?subject=" + encodeURIComponent(p.name + " order"); c.textContent = p.contact;
    document.getElementById("back").href = slug + "/";
    document.title = "Thank you — " + p.name;
  }
})();
</script>
</body>
</html>
